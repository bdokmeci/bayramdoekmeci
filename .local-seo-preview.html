<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}iframe{display:block;border:0;height:1100px}</style></head><body><iframe id="frame" title="Landingpage-Vorschau"></iframe><script>const p=new URLSearchParams(location.search);const f=document.querySelector('iframe');f.style.width=(p.get('width')||1440)+'px';f.onload=()=>{const d=f.contentDocument;d.documentElement.style.scrollBehavior='auto';const id=p.get('section');if(id)setTimeout(()=>{const el=d.getElementById(id);f.contentWindow.scrollTo({top:el.getBoundingClientRect().top+f.contentWindow.scrollY-28,behavior:'instant'});document.title='READY'},800)};f.src='/kartendienst/';</script></body></html>
