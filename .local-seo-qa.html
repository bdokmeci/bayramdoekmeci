<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{border:0;height:1000px}pre{white-space:pre-wrap}</style></head><body><iframe id="live" src="/kartendienst/"></iframe><iframe id="nojs" sandbox="allow-same-origin" src="/kartendienst/"></iframe><pre id="result">RUNNING</pre><script>
const results=[]; const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const check=(name,pass,detail)=>results.push({name,pass,detail});
async function run(){try{const f=document.querySelector('#live');const w=f.contentWindow;const d=f.contentDocument;await sleep(400);check('Alpine initialized',d.body.classList.contains('enhanced'),typeof w.Alpine);
for(const width of [360,390,600,768,1024,1280,1440]){f.style.width=width+'px';await sleep(100);check('No horizontal overflow at '+width,d.documentElement.scrollWidth<=w.innerWidth,{viewport:w.innerWidth,scrollWidth:d.documentElement.scrollWidth});}
f.style.width='360px'; await sleep(100);check('Mobile contact bar visible',w.getComputedStyle(d.querySelector('.bottom-bar')).display==='flex');
const chart=d.querySelector('.chart');chart.scrollIntoView();await sleep(700);let buttons=[...d.querySelectorAll('.segments button')];buttons[1].click();await sleep(900);check('Chart target updates text',d.querySelector('.chart-status').textContent==='Ziel: 12 korrekte, eindeutige Einträge.');check('Chart target updates bars',w.getComputedStyle(d.querySelector('.bar-fill')).transform==='matrix(1, 0, 0, 1, 0, 0)',w.getComputedStyle(d.querySelector('.bar-fill')).transform);check('Chart pressed state',buttons[1].getAttribute('aria-pressed')==='true'&&buttons[0].getAttribute('aria-pressed')==='false');buttons[0].click();await sleep(800);check('Chart returns to initial state',d.querySelector('.bar-value').textContent==='4 / 12');
const faq=d.querySelector('.faq-list details');faq.querySelector('summary').click();check('FAQ opens',faq.open);faq.querySelector('summary').click();check('FAQ closes',!faq.open);
const menu=d.querySelector('.mobile-menu');menu.querySelector('summary').click();check('Mobile menu opens',menu.open);menu.querySelector('a').click();check('Mobile menu closes after navigation',!menu.open);
const nj=document.querySelector('#nojs');nj.style.width='360px';await sleep(100);check('No-JS content visible',nj.contentDocument.querySelectorAll('.reveal-pending').length===0 && nj.contentWindow.getComputedStyle(nj.contentDocument.querySelector('.map-panel')).opacity==='1');check('No-JS chart controls hidden',nj.contentWindow.getComputedStyle(nj.contentDocument.querySelector('.segments')).display==='none');const nf=nj.contentDocument.querySelector('.faq-list details');nf.querySelector('summary').click();check('No-JS FAQ works',nf.open);check('No-JS data table exists',nj.contentDocument.querySelectorAll('.chart-table tbody tr').length===4);
check('Reduced motion query',true,w.matchMedia('(prefers-reduced-motion: reduce)').matches);
}catch(e){results.push({name:'Runtime error',pass:false,detail:String(e)})}document.querySelector('#result').textContent=JSON.stringify(results);document.title=results.every(x=>x.pass)?'PASS':'FAIL';}
window.addEventListener('load',run);
</script></body></html>
